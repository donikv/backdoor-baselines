[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdbaselines"
version = "1.0.0"
description = "Baseline backdoor detectors (Fields, DFBScanner, HTell, CLP, ProP, BNP, MM-BD, FreeEagle) with their native decision rules"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=2",
    "scipy>=1.11",
    "bdzoo",  # checkpoint loading and data: https://github.com/<org>/backdoor-zoo
]

[project.optional-dependencies]
rules = ["scikit-optimize==0.10.2", "scikit-learn>=1.5"]  # DFBScanner's F1 threshold, FreeEagle's ROC rule
test = ["pytest>=8"]

[tool.setuptools]
packages = ["bdbaselines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
